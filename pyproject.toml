[project]
name = "water-timeseries"
version = "0.17.3"
description = "Toolbox to download, analyze, and visualize water area time-series"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ingmar Nitze", email = "ingmarnitze@gmail.com" }
]
requires-python = ">=3.12, <3.14"
dependencies = [
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "geopandas>=0.8.0",
    "tqdm",
    "netcdf4",
    "seaborn",
    "matplotlib>=3.8.0",
    "shapely",
    # pyarrow 26+ refuses to import with numpy < 2 ("requires NumPy 2.0 or newer"), while this
    # project pins numpy < 2; 18 is the first release with cp313 wheels. 18-25 import cleanly
    # against numpy 1.26 (verified per version), so cap below 26 instead of downgrading.
    "pyarrow>=18.0.0,<26.0.0",
    "h3pandas",
    "h3>=4.0.0,<5.0.0",
    "joblib>=1.4.2",
    # 2.60 is the first release with cp313/cp314 Windows wheels; earlier 2.4x/2.5x ship
    # them only up to cp312, which made `uv sync` fail on Windows with Python 3.13.
    "ray[default]>=2.60.0",
    "h5netcdf>=1.4.1",
    "zarr>=2.18.4",
    "opencv-python>=4.11.0.86",
    "statsmodels>=0.14.4",
    "scikit-learn>=1.6.1",
    #"basemap>=1.4.1",
    "plotly-geo>=1.0.0",
    "dask-geopandas>=0.4.2",
    "sklearn-xarray>=0.4.0",
    "rbeast>=0.1.23",
    "loguru>=0.7.3",
    "typer>=0.24.1",
    "typer-config>=1.5.0",
    "lz4>=4.4.5",
    "ipykernel",
    "jupyterlab",
    "cyclopts>=4.8.0",
    "rich>=14.3.3",
    "nbconvert>=7.17.0",
    "tk>=0.1.0",
    "geemap>=0.37.3",
    "eemont>=2025.7.1",
    "streamlit>=1.40.0",
    "plotly>=6.0.0",
    "folium>=0.20.0",
    "folium-pmtiles>=0.4.0",
    "streamlit-folium>=0.25.0",
    "ffmpeg>=1.4",
    "ffmpeg-python>=0.2.0",
    "mapclassify>=2.10.0",
    # loose pin: nothing in the package imports it, and a hard == blocked ray>=2.60,
    # which needs packaging>=24.2 for its own metadata handling.
    "packaging>=24.1",
    "sktime>=0.40.1",
    "pmdarima>=2.1.1",
    "dask[dataframe]>=2026.3.0",
    "xarray>=2026.2.0",
    "ee-extra>=2025.7.2",
    "geoparquet-io>=1.1.1",
    "tqdm-joblib>=0.0.5",
    "polars[rtcompat]>=1.40.1",
    "gcloud>=0.18.3",
    "xee>=0.1.1",
    "rioxarray>=0.19.0",
    "leafmap>=0.62.0",
    "pygeohash>=3.3.0",
    "ruff>=0.16.0",
    "gcsfs>=2026.6.0",
    "h5py>=3.16.0",
    "numcodecs>=0.16.5",
    "contextily>=1.7.1",
]

[project.optional-dependencies]
# PMTiles building shells out to the `tippecanoe` binary. Installing this extra provides one
# (it compiles from sdist: needs cmake >= 3.20 plus scikit_build_core and setuptools_scm < 10);
# a system install (brew/apt) works just as well - `find_tippecanoe` only looks on PATH.
pmtiles = [
    "tippecanoe>=2.72.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "ruff>=0.16.0",
    "setuptools>=65.0",
    "wheel>=0.38.0",
    "twine>=4.0.0",
    "gh>=0.0.4",
    "google-cloud-storage",
]
docs = [
    "mkdocs>=1.5.0,<2.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0",
    "mike>=2.1.3",
]

[project.scripts]
water-timeseries-bp = "water_timeseries.scripts.break_pipeline:main"
water-timeseries-plot = "water_timeseries.scripts.plot_pipeline:main"
water-timeseries = "water_timeseries.scripts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# use ruff as the primary linter/formatter with compatibility to black/isort
# ruff will enforce the same line length and import sorting style
line-length = 120
exclude = [".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
extend-select = ["I"]
# BLE001 is enforced: deliberate broad catches carry a per-line noqa instead.
# S110/S112: the silent handlers guard optional cleanup where logging adds noise.
extend-ignore = ["E203", "S110", "S112"]

[tool.pytest.ini_options]
# Pytest configuration for water-timeseries

# Test discovery
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# Output options
addopts = "-v --strict-markers"

# Markers for test categorization
markers = [
    "loading: Tests for dataset loading",
    "normalization: Tests for data normalization",
    "plotting: Tests for plotting functionality",
]

# Filter out third-party deprecation warnings
filterwarnings = [
    "ignore::DeprecationWarning:matplotlib._fontconfig_pattern",
    "ignore::DeprecationWarning:matplotlib._mathtext",
    "ignore:parseString.*:DeprecationWarning",
    "ignore:enablePackrat.*:DeprecationWarning",
]

# Console output
testpaths = ["tests"]
