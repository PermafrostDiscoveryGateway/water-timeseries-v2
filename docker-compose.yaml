services:
  app:
    build: .
    image: water-timeseries-streamlit:latest
    working_dir: /app
    # Use the installed CLI (same launch path as production/helm). All data
    # paths live in the config file, which carries both view modes; point
    # DASHBOARD_CONFIG at another YAML to switch datasets.
    command:
      - water-timeseries
      - dashboard
      - --config-file
      - ${DASHBOARD_CONFIG:-configs/dashboard_panarctic.yaml}
    volumes:
      - .:/app
      # Keep image .venv; a plain .:/app mount would hide it with an empty host dir
      - /app/.venv
      # Large/local datasets (gitignored downloads/; override host dirs via .env)
      - ${DOWNLOADS_DIR:-./downloads}:/app/downloads:ro
      # Datasets referenced by configs/dashboard_panarctic.yaml (data/... paths, as in production)
      - ${DATA_DIR:-./data}:/app/data:ro
      # Optional: host EE credentials (alternative to EARTHENGINE_TOKEN in .env)
      - ${EARTHENGINE_CREDENTIALS_DIR:-${HOME}/.config/earthengine}:/root/.config/earthengine:ro
      # Host GCloud Application Default Credentials (ADC)
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    ports:
      - "8501:8501"
      # PMTiles tile server - the browser fetches tiles directly from this port.
      # Port 0 (random) doesn't work in Docker because it can't be pre-published.
      - "8502:8502"
    env_file:
      - path: .env
        required: false
    environment:
      MPLBACKEND: Agg
      EE_PROJECT: ${EE_PROJECT:-}
      EARTHENGINE_TOKEN: ${EARTHENGINE_TOKEN:-}
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
      # PMTiles tile server: bind on a fixed port so Docker can publish it,
      # and tell the browser to reach it via localhost (the published port).
      PMTILES_PORT: "8502"
      PMTILES_HOST: "localhost"
