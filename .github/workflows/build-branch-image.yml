name: Build Branch Image

# Builds and pushes a Docker image tagged with the branch name, so a
# feature/fix branch can be tested by downstream pipelines (e.g. the Argo
# workflow) before it's merged and released.

permissions:
  contents: read
  packages: write

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Docker tag (lowercase, branch name)
        id: docker_tags
        run: |
          # Convert repository name to lowercase for GHCR
          REPO_LOWER="${{ github.repository }}"
          REPO_LOWER="${REPO_LOWER,,}"
          REGISTRY="ghcr.io/${REPO_LOWER}"

          # Docker tags only allow [a-zA-Z0-9_.-], so sanitize the branch name
          BRANCH_TAG="${{ github.ref_name }}"
          BRANCH_TAG="${BRANCH_TAG,,}"
          BRANCH_TAG="${BRANCH_TAG//[^a-z0-9_.-]/-}"

          TAGS="${REGISTRY}:${BRANCH_TAG}"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

          echo "Will push to: ${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest output
        run: |
          echo "✅ Successfully pushed:"
          echo "${{ steps.docker_tags.outputs.tags }}"
